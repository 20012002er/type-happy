name: type-happy

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: type-happy-server:latest
    environment:
      NODE_ENV: production
      PORT: '3001'
    restart: unless-stopped
    # 3001 仅供 web(nginx)容器在内部网络反代,不发布到宿主机;
    # 如需从宿主机直接访问 API,取消下面注释:
    # ports:
    #   - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 站点对外地址,用于生成 sitemap.xml / robots.txt(SEO)
        SITE_URL: ${SITE_URL:-https://type.toby-blog.com}
        # 设为 false 可跳过构建阶段的 Chromium 下载与全路由预渲染(最小构建资源,牺牲百度收录效果)
        PRERENDER: ${PRERENDER:-true}
    image: type-happy-web:latest
    ports:
      - '8088:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
