server {
    listen 80;
    server_name _;

    # 容器位于 TLS 终止代理之后,nginx 看到的 scheme 恒为 http;
    # 关闭绝对重定向,使目录补斜杠等 301 的 Location 为相对路径,
    # 避免浏览器把 http:// 绝对地址当混合内容拦截。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # API 反向代理到 server 容器(compose 服务名 server,端口 3001)。
    # 使用 Docker 内置 DNS + 变量形式 proxy_pass,避免 nginx 启动时上游未就绪而退出,
    # 且 server 容器重建换 IP 后无需 reload 即可恢复。
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://server:3001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端健康检查透传,便于从对外端口探测
    location = /health {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://server:3001";
        proxy_pass $backend;
    }

    # vite 构建产物带内容哈希,长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存,保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退(不匹配目录,避免与 public 子目录同名路由触发补斜杠重定向)
    location / {
        try_files $uri /index.html;
    }
}
