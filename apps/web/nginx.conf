# 按请求 URI 生成 Cache-Control:
# - vite 哈希产物长缓存;游戏/图标等静态资源 7 天;sitemap/robots 1 小时
# - 其余(入口 HTML、预渲染路由快照、SPA 干净 URL、/api)一律 no-cache,发版即时生效
map $uri $cache_control {
    ~^/assets/ "public, max-age=2592000, immutable";
    ~\.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|mp3|ogg|wav|atlas|json|map)$ "public, max-age=604800";
    ~^/(sitemap\.xml|robots\.txt)$ "max-age=3600";
    default "no-cache";
}

server {
    listen 80;
    server_name _;

    # 容器位于 TLS 终止代理之后,nginx 看到的 scheme 恒为 http;
    # 关闭绝对重定向,使目录补斜杠等 301 的 Location 为相对路径,
    # 避免浏览器把 http:// 绝对地址当混合内容拦截。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml text/xml;

    # API 反向代理到 server 容器(compose 服务名 server,端口 3001)。
    # 使用 Docker 内置 DNS + 变量形式 proxy_pass,避免 nginx 启动时上游未就绪而退出,
    # 且 server 容器重建换 IP 后无需 reload 即可恢复。
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://server:3001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端健康检查透传,便于从对外端口探测
    location = /health {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://server:3001";
        proxy_pass $backend;
    }

    # 优先命中真实文件,其次命中预渲染路由快照(目录内 index.html,内部处理无 301),
    # 最后回落到入口 HTML 由前端路由接管
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
